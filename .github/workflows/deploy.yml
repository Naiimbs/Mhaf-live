name: Deploy MHAF Live

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mhaf-live-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/naiimbs/mhaf-live

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing VPS_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Log in to GHCR from VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -eu
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing VPS_USER"; exit 1; }
          test -n "$GHCR_PULL_USERNAME" || { echo "Missing GHCR_PULL_USERNAME"; exit 1; }
          test -n "$GHCR_PULL_TOKEN" || { echo "Missing GHCR_PULL_TOKEN"; exit 1; }
          PORT="${VPS_PORT:-22}"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -i ~/.ssh/id_ed25519 -p "$PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_PULL_USERNAME' --password-stdin"

      - name: Copy Compose configuration to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -eu
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing VPS_USER"; exit 1; }
          PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "mkdir -p /opt/mhaf-live"
          scp -i ~/.ssh/id_ed25519 -P "$PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            docker-compose.db.yml \
            "$VPS_USER@$VPS_HOST:/opt/mhaf-live/docker-compose.db.yml"

      - name: Deploy and health-check on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -eu
          PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -eu
          ENV_FILE=/opt/mhaf-live/.env
          DATA_DIR=/opt/mhaf-live/data
          COMPOSE_FILE=/opt/mhaf-live/docker-compose.db.yml
          CONTAINER=mhaf-live
          ROLLBACK=mhaf-live-rollback

          pull_with_retry() {
            local target="$1"
            local max_attempts=5
            local delay=5
            echo "Checking VPS container storage before pulling the deployment image..."
            df -h /var/lib/containerd || true
            docker system df || true
            echo "Skipping global Docker image pruning to protect other services on this VPS."
            for attempt in $(seq 1 "$max_attempts"); do
              echo "Pulling image $target (attempt $attempt of $max_attempts)..."
              if docker pull "$target"; then
                echo "Successfully pulled $target."
                return 0
              fi
              echo "Warning: docker pull failed on attempt $attempt. Retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            done
            echo "Error: Failed to pull image $target after $max_attempts attempts."
            return 1
          }

          if [ ! -s "$ENV_FILE" ]; then
            echo "Missing $ENV_FILE; create a production env file first."
            exit 1
          fi
          SECRET="$(sed -n 's/^NEXTAUTH_SECRET=//p' "$ENV_FILE" | tail -n 1 | tr -d '"\047[:space:]\r')"
          if [ "${#SECRET}" -lt 32 ] || echo "$SECRET" | grep -Eiq 'placeholder|replace_with|dev-secret|minimum_32'; then
            echo "NEXTAUTH_SECRET must be a unique, non-placeholder secret of at least 32 characters."
            exit 1
          fi

          REMINDER_SECRET="$(sed -n 's/^BOOKING_REMINDER_CRON_SECRET=//p' "$ENV_FILE" | tail -n 1 | tr -d '"\047[:space:]\r')"
          if [ "${#REMINDER_SECRET}" -lt 32 ] || echo "$REMINDER_SECRET" | grep -Eiq 'placeholder|replace_with|dev-secret'; then
            echo "BOOKING_REMINDER_CRON_SECRET must be a unique secret of at least 32 characters in $ENV_FILE."
            exit 1
          fi

          LIVEKIT_URL_VALUE="$(sed -n 's/^LIVEKIT_URL=//p' "$ENV_FILE" | tail -n 1 | tr -d '"\047[:space:]\r')"
          if [ -z "$LIVEKIT_URL_VALUE" ]; then
            LIVEKIT_URL_VALUE="$(sed -n 's/^NEXT_PUBLIC_LIVEKIT_URL=//p' "$ENV_FILE" | tail -n 1 | tr -d '"\047[:space:]\r')"
          fi
          if [ -z "$LIVEKIT_URL_VALUE" ]; then
            echo "LIVEKIT_URL (or NEXT_PUBLIC_LIVEKIT_URL) is required in $ENV_FILE."
            exit 1
          fi
          case "$LIVEKIT_URL_VALUE" in
            wss://*) ;;
            *) echo "LIVEKIT_URL must use wss:// in production."; exit 1 ;;
          esac
          LIVEKIT_URL_LOWER="$(printf '%s' "$LIVEKIT_URL_VALUE" | tr '[:upper:]' '[:lower:]')"
          case "$LIVEKIT_URL_LOWER" in
            *localhost*|*127.0.0.1*|*0.0.0.0*|*replace_with*|*placeholder*)
              echo "LIVEKIT_URL must be a real, browser-reachable production endpoint."
              exit 1
              ;;
          esac
          for VARIABLE in LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            VALUE="$(sed -n "s/^${VARIABLE}=//p" "$ENV_FILE" | tail -n 1 | tr -d '"\047[:space:]\r')"
            VALUE_LOWER="$(printf '%s' "$VALUE" | tr '[:upper:]' '[:lower:]')"
            case "$VALUE_LOWER" in
              ""|devkey|secret|*replace_with*|*placeholder*)
                echo "$VARIABLE is missing or still contains a development placeholder in $ENV_FILE."
                exit 1
                ;;
            esac
          done
          echo "LiveKit production URL and credentials are present and pass basic validation."

          mkdir -p "$DATA_DIR"
          docker network inspect mhaf-network >/dev/null 2>&1 || docker network create mhaf-network

          # PostgreSQL service lifecycle & pre-migration verification
          if grep -q '^DATABASE_URL=' "$ENV_FILE"; then
            echo "PostgreSQL configuration detected in environment file."

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "Missing Compose configuration at $COMPOSE_FILE; aborting."
              exit 1
            fi

            # Consistency checks for database configuration without exposing secrets
            PG_PASS="$(sed -n 's/^POSTGRES_PASSWORD=//p' "$ENV_FILE" | tail -n 1 | tr -d '"\047[:space:]\r')"
            if [ -z "$PG_PASS" ]; then
              echo "POSTGRES_PASSWORD must be configured in $ENV_FILE when DATABASE_URL is present."
              exit 1
            fi

            if ! grep -qE '^DATABASE_URL=.*postgres(ql)?://' "$ENV_FILE"; then
              echo "DATABASE_URL must be a valid PostgreSQL connection string starting with postgresql:// or postgres://"
              exit 1
            fi

            if ! grep -qE '^DATABASE_URL=.*@mhaf-db(:[0-9]+)?/' "$ENV_FILE"; then
              echo "DATABASE_URL must target internal Docker hostname 'mhaf-db' on mhaf-network."
              exit 1
            fi

            echo "Database configuration syntax and hostname verified."

            # Start or ensure PostgreSQL service is up
            echo "Starting PostgreSQL service via Docker Compose..."
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d

            # Bounded health-check for PostgreSQL container
            echo "Waiting for PostgreSQL (mhaf-db) to become healthy..."
            DB_HEALTH=starting
            for _ in $(seq 1 30); do
              DB_HEALTH="$(docker inspect --format '{{.State.Health.Status}}' mhaf-db 2>/dev/null || echo missing)"
              [ "$DB_HEALTH" = healthy ] && break
              if [ "$DB_HEALTH" = unhealthy ]; then
                echo "PostgreSQL container reported unhealthy status."
                docker logs --tail 50 mhaf-db || true
                exit 1
              fi
              sleep 2
            done

            if [ "$DB_HEALTH" != healthy ]; then
              echo "Timed out waiting for PostgreSQL container to report healthy (status: $DB_HEALTH)."
              docker logs --tail 50 mhaf-db || true
              exit 1
            fi
            echo "PostgreSQL service is healthy and ready for migrations."

            # Run Prisma migrations while the current production container is STILL RUNNING
            echo "Applying database migrations before stopping current container..."
            pull_with_retry "$IMAGE"
            if ! docker run --rm \
              --network mhaf-network \
              --env-file "$ENV_FILE" \
              "$IMAGE" \
              npx prisma migrate deploy; then
              echo "Prisma migration failed; aborting deployment."
              echo "The existing production container was not stopped and remains active."
              exit 1
            fi
            echo "Database migrations applied successfully."
          else
            pull_with_retry "$IMAGE"
          fi

          # The bind-mounted JSON store must be readable and writable by the app's
          # non-root user (UID/GID 1001), not just by the SSH/deploy account.
          echo "Preserving existing JSON data ownership; verifying access without changing file owners or permissions."
          echo "Verifying JSON storage write access as the application user..."
          if ! docker run --rm --user 1001:1001 \
            -v "$DATA_DIR:/app/data" \
            --entrypoint node "$IMAGE" \
            -e 'const fs=require("node:fs");const {randomUUID}=require("node:crypto");const p="/app/data/.write-check-"+randomUUID();fs.writeFileSync(p,"ok",{flag:"wx",mode:0o600});fs.unlinkSync(p);'; then
            echo "Application user UID 1001 cannot write to the persistent data volume; aborting before stopping the current container."
            exit 1
          fi
          echo "Persistent JSON storage is writable by the application user."

          if docker container inspect "$ROLLBACK" >/dev/null 2>&1; then
            echo "Rollback container already exists; refusing to overwrite it."
            exit 1
          fi

          # Preflight network checks: verify required infrastructure before destructive actions
          if ! docker network inspect mhaf-network >/dev/null 2>&1; then
            echo "CRITICAL: Required network 'mhaf-network' does not exist; aborting before stopping current container."
            exit 1
          fi
          if ! docker network inspect proxy >/dev/null 2>&1; then
            echo "CRITICAL: Required external Docker network 'proxy' does not exist. Caddy reverse proxy cannot reach the application. Aborting before stopping current container."
            exit 1
          fi

          # Minimal-downtime container replacement after successful migrations and preflight
          HAD_OLD=0
          if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
            echo "Stopping current production container for replacement..."
            docker stop "$CONTAINER"
            docker rename "$CONTAINER" "$ROLLBACK"
            HAD_OLD=1
          fi

          echo "Starting new container $CONTAINER..."
          if ! docker run -d --name "$CONTAINER" --restart unless-stopped \
            --network mhaf-network \
            -p 127.0.0.1:18083:3000 \
            --env-file "$ENV_FILE" \
            -v "$DATA_DIR:/app/data" \
            "$IMAGE"; then
            echo "Failed to start new container. Initiating rollback..."
            if [ "$HAD_OLD" -eq 1 ]; then
              docker rename "$ROLLBACK" "$CONTAINER"
              docker start "$CONTAINER"
              docker network connect proxy "$CONTAINER" 2>/dev/null || true
              RESTORED_PROXY=$(docker inspect "$CONTAINER" --format '{{if index .NetworkSettings.Networks "proxy"}}attached{{else}}missing{{end}}' 2>/dev/null || echo missing)
              if [ "$RESTORED_PROXY" != "attached" ]; then
                echo "CRITICAL: Restored container is not attached to proxy network!"
              else
                echo "Restored container verified attached to proxy network."
              fi
            fi
            exit 1
          fi

          # Attach new container to required Caddy proxy network
          echo "Connecting new container $CONTAINER to Caddy proxy network..."
          if ! docker network connect proxy "$CONTAINER"; then
            echo "CRITICAL: Failed to connect $CONTAINER to proxy network. Initiating rollback..."
            docker logs --tail 80 "$CONTAINER" || true
            docker rm -f "$CONTAINER" || true
            if [ "$HAD_OLD" -eq 1 ]; then
              echo "Restoring previous production container..."
              docker rename "$ROLLBACK" "$CONTAINER"
              docker start "$CONTAINER"
              docker network connect proxy "$CONTAINER" 2>/dev/null || true
              RESTORED_PROXY=$(docker inspect "$CONTAINER" --format '{{if index .NetworkSettings.Networks "proxy"}}attached{{else}}missing{{end}}' 2>/dev/null || echo missing)
              if [ "$RESTORED_PROXY" != "attached" ]; then
                echo "CRITICAL: Restored container is not attached to proxy network!"
              else
                echo "Restored container verified attached to proxy network."
              fi
            fi
            echo "Deployment aborted and previous container restored due to proxy network connection failure."
            exit 1
          fi
          echo "Connected $CONTAINER to proxy network successfully."

          # Verify the new container is attached to all required networks
          HEALTH=""
          MHAF_NET_STATUS="$(docker inspect "$CONTAINER" --format '{{if index .NetworkSettings.Networks "mhaf-network"}}attached{{else}}missing{{end}}' 2>/dev/null || echo missing)"
          if [ "$MHAF_NET_STATUS" != "attached" ]; then
            echo "CRITICAL: Container $CONTAINER is not attached to required network 'mhaf-network'."
            HEALTH="missing_mhaf_network"
          fi

          PROXY_NET_STATUS="$(docker inspect "$CONTAINER" --format '{{if index .NetworkSettings.Networks "proxy"}}attached{{else}}missing{{end}}' 2>/dev/null || echo missing)"
          if [ "$PROXY_NET_STATUS" != "attached" ]; then
            echo "CRITICAL: Container $CONTAINER is not attached to required network 'proxy'."
            HEALTH="missing_proxy_network"
          fi

          # Bounded health-check for new container (only if network verification passed)
          if [ -z "$HEALTH" ]; then
            HEALTH=starting
            for _ in $(seq 1 30); do
              HEALTH="$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo missing)"
              [ "$HEALTH" = healthy ] && break
              [ "$HEALTH" = unhealthy ] && break
              sleep 2
            done
          fi

          if [ "$HEALTH" != healthy ]; then
            echo "New container failed health check (status: $HEALTH). Capturing logs..."
            docker logs --tail 80 "$CONTAINER" || true
            docker rm -f "$CONTAINER" || true
            if [ "$HAD_OLD" -eq 1 ]; then
              echo "Restoring previous production container..."
              docker rename "$ROLLBACK" "$CONTAINER"
              docker start "$CONTAINER"
              if docker network inspect proxy >/dev/null 2>&1; then
                docker network connect proxy "$CONTAINER" 2>/dev/null || true
                RESTORED_PROXY=$(docker inspect "$CONTAINER" --format '{{if index .NetworkSettings.Networks "proxy"}}attached{{else}}missing{{end}}' 2>/dev/null || echo missing)
                if [ "$RESTORED_PROXY" != "attached" ]; then
                  echo "CRITICAL: Restored container is not attached to proxy network!"
                else
                  echo "Restored container verified attached to proxy network."
                fi
              fi
            fi
            echo "Deployment aborted and previous container restored."
            exit 1
          fi

          if [ "$HAD_OLD" -eq 1 ]; then
            docker rm "$ROLLBACK"
          fi
          echo "MHAF Live deployed and healthy on 127.0.0.1:18083."

          # Persistent scheduler sidecar calls the protected endpoint every minute over the private Docker network.
          echo "Starting MHAF Live booking reminder scheduler..."
          docker rm -f mhaf-live-reminders >/dev/null 2>&1 || true
          docker run -d --name mhaf-live-reminders --restart unless-stopped --network mhaf-network --env BOOKING_REMINDER_CRON_SECRET="$REMINDER_SECRET" --entrypoint node "$IMAGE" -e 'const url="http://mhaf-live:3000/api/internal/booking-reminders"; const secret=process.env.BOOKING_REMINDER_CRON_SECRET; if(!secret||secret.length<32) process.exit(2); (async()=>{for(;;){try{const r=await fetch(url,{headers:{authorization:"Bearer "+secret},signal:AbortSignal.timeout(20000)});if(!r.ok) console.error("[reminder-scheduler] endpoint returned",r.status);else console.log("[reminder-scheduler]",await r.text());}catch(e){console.error("[reminder-scheduler]",e.message);} await new Promise(resolve=>setTimeout(resolve,60000));}})();'
          sleep 2
          if [ "$(docker inspect --format '{{.State.Running}}' mhaf-live-reminders 2>/dev/null || echo false)" != "true" ]; then
            echo "Booking reminder scheduler container is not running."
            docker logs --tail 50 mhaf-live-reminders || true
            exit 1
          fi
          echo "Booking reminder scheduler is running (60-second interval)."
          REMOTE
