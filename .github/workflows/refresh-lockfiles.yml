name: Refresh dependency lockfiles

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - ".github/workflows/refresh-lockfiles.yml"

permissions:
  contents: read

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-lockfiles
          path: |
            package-lock.json
            bun.lock
          if-no-files-found: error
          retention-days: 3
