name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: mhaf-live-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type-check application
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Run unit tests
        run: npm run test:unit


  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Microsoft Edge for Playwright
        run: npx playwright install --with-deps msedge
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"

  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build production application
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-only-secret-not-for-production-32-chars
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          LIVEKIT_URL: wss://livekit.test.invalid
          LIVEKIT_API_KEY: mhaf-ci-test-key
          LIVEKIT_API_SECRET: mhaf-ci-test-secret

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit production dependencies
        # Advisory initially: report existing dependency risk without blocking unrelated fixes.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  refresh-lockfiles:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only
      - name: Upload refreshed lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-lockfiles
          path: |
            package-lock.json
            bun.lock
          if-no-files-found: error
          retention-days: 3
